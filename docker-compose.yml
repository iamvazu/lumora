name: lumora-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumora_user
      POSTGRES_PASSWORD: lumora_password
      POSTGRES_DB: lumora_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumora_user -d lumora_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lumora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumora_minio_root
      MINIO_ROOT_PASSWORD: lumora_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lumora-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  livekit:
    image: livekit/livekit-server:latest
    container_name: lumora-livekit
    restart: unless-stopped
    command: --dev
    ports:
      - "7880:7880" # HTTP/WebSocket
      - "7881:7881" # TCP RTC
      - "7882:7882/udp" # UDP RTC

volumes:
  pgdata:
  redisdata:
  miniodata:
